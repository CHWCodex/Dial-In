# Every night just after midnight UK time, adds yesterday's puzzle to /past-puzzles and its own /dial-in-answers-N page and refreshes the sitemap.
# Cloudflare Pages redeploys automatically when this pushes to main.
name: Daily search pages
on:
  schedule:
    - cron: '20 0 * * *'    # 00:20 UK in winter (GMT)
    - cron: '20 23 * * *'   # 00:20 UK in summer (BST); a run with nothing new commits nothing
  workflow_dispatch:
permissions:
  contents: write
concurrency: daily-pages
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-seo-pages.mjs
      # Content health: records the puzzle that just went live and checks the questions, schedule and inventory.
      # A failure here fails the run (GitHub emails the owner) without stopping the pages above being published.
      - name: Check questions, record today's puzzle
        id: health
        continue-on-error: true
        run: node scripts/build-content.mjs --usage-only && node scripts/validate-questions.mjs --record-published
      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "No changes"; exit 0; fi
          git config user.name "dialin-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Daily: update past puzzles, answer pages and sitemap"
          git push
      - name: Alert if the content check failed
        if: steps.health.outcome == 'failure'
        run: |
          echo "::error::Question/schedule check failed: see the 'Check questions' step above (low inventory, a changed published puzzle or invalid content)."
          exit 1
